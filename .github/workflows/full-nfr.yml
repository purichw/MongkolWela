name: Full NFR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

concurrency:
  group: full-nfr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nfr:
    name: Full non-functional checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full NFR suite
        run: npm run nfr
