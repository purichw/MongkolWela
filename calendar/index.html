<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ปฏิทินไทย | มงคลเวลา</title>
    <meta
      name="description"
      content="ปฏิทินไทยและจันทรคติไทย พ.ศ.2300-2700 พร้อมวันพระ วันมงคล ดิถี หมายเหตุ และรายละเอียดรายวัน"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="../styles.css?v=20260605-23">
  </head>
  <body class="thai-calendar-page">
    <div data-site-header data-locale="th" data-page="calendar" data-root="../"></div>

    <main id="calendar-top">
      <section class="thai-calendar-hero">
        <div>
          <nav class="calendar-breadcrumb" aria-label="breadcrumb">
            <a href="../">หน้าแรก</a>
            <span>/</span>
            <span>ปฏิทินไทย</span>
          </nav>
          <p class="section-kicker">ปฏิทินมงคล</p>
          <h1>เปิดปฏิทินไทย แล้วอ่านวันให้ลึกกว่าเลขวันที่</h1>
          <p>
            เลือกปี พ.ศ. 2300-2700 เพื่อดูจันทรคติไทย วันพระ วันหยุด เทศกาล
            และดิถีที่ควรใช้หรือควรระวัง ก่อนลงรายละเอียดรายวัน
          </p>
        </div>
        <div class="calendar-hero-card" aria-label="ตัวอย่างปฏิทิน">
          <h2>มิถุนายน 2569</h2>
          <div class="mini-calendar">
            <span>1</span><span>2</span><span>3</span><span>4</span><span class="is-selected">5</span><span>6</span><span>7</span>
            <span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span>
            <span>15</span><span>16</span><span class="is-holy">17</span><span>18</span><span>19</span><span>20</span><span>21</span>
          </div>
        </div>
      </section>

      <div class="calendar-control-shell">
        <div class="calendar-controls">
          <form data-calendar-form>
            <label for="calendar-year">เลือกปี พ.ศ.</label>
            <select id="calendar-year" name="year" data-calendar-year></select>
          </form>
          <nav class="calendar-month-nav" data-calendar-months aria-label="เลือกเดือน"></nav>
          <a class="primary-action" data-calendar-today href="./day/">วันนี้</a>
        </div>
      </div>

      <section class="calendar-shell" aria-live="polite">
        <div class="calendar-summary" data-calendar-summary></div>
        <div class="calendar-year-grid" data-calendar-grid></div>
      </section>
    </main>

    <div data-site-footer data-locale="th" data-page="calendar" data-root="../"></div>

    <script type="module" src="../script.js?v=20260605-23"></script>
    <script type="module" src="../assets/js/thai-calendar-year.js?v=20260605-23"></script>
  </body>
</html>
